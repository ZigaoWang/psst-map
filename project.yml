name: PsstMap
options:
  bundleIdPrefix: app.psstmap
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  PsstMap:
    type: application
    platform: iOS
    sources:
      - path: PsstMap
      - path: Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.psstmap.ios
        PRODUCT_NAME: PsstMap
        INFOPLIST_KEY_CFBundleDisplayName: Psst
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Psst uses your location to show the places around you and sort the feed by distance. It never leaves your device."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  PsstMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PsstMapTests
    dependencies:
      - target: PsstMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.psstmap.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PsstMap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PsstMap"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PsstMap:
    build:
      targets:
        PsstMap: all
        PsstMapTests: [test]
    test:
      targets:
        - PsstMapTests
      gatherCoverageData: false
    run:
      config: Debug
